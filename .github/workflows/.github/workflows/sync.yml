name: Sincronizar painéis da planilha

on:
  schedule:
    - cron: "0 * * * *"     # de hora em hora (horário UTC)
  workflow_dispatch:         # permite rodar manualmente na aba Actions

permissions:
  contents: write

concurrency:
  group: sync-planilha
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Baixar planilha e gerar JSON
        env:
          SHEET_CSV_URL: ${{ vars.SHEET_CSV_URL || 'https://docs.google.com/spreadsheets/d/e/2PACX-1vSGMpUf33Ei80CLFGIctEDF--KgLwEsk4SNaW06yTYIvn9EiV25QSsme3z896BWwb8wqOvPxyBbStTu/pub?gid=1526054155&single=true&output=csv' }}
        run: python scripts/sync_sheet.py
      - name: Commit se houve mudança
        run: |
          if [[ -n "$(git status --porcelain data/)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/paineis.json
            git commit -m "chore(dados): sincroniza planilha"
            git push
          else
            echo "Nada a commitar."
          fi
